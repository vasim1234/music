name: music
description: A local music player app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  audiotags: ^1.4.2
  path_provider: ^2.1.4
  audio_service: ^0.18.15              # ✅ ADD KARO
  just_audio: ^0.9.40                   # ✅ ADD KARO
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0F14"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
