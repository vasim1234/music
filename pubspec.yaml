publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  audiotags: ^1.4.2
