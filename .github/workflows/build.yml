name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Clear Flutter Cache
        run: |
          echo "🧹 Clearing Flutter cache..."
          flutter clean
          rm -rf ~/.pub-cache
          rm -f pubspec.lock
          echo "✅ Cache cleared and pubspec.lock deleted!"
      
      - name: Fix pubspec.yaml
        run: |
          echo "🔧 Fixing pubspec.yaml..."
          cat > pubspec.yaml << 'EOF'
          name: music
          description: A local music player app
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: ">=3.0.0 <4.0.0"
          
          dependencies:
            flutter:
              sdk: flutter
            audioplayers: ^5.2.1
            audiotags: ^1.4.2
            file_picker: ^8.0.0
            path_provider: ^2.1.4
            permission_handler: ^11.3.1
            shared_preferences: ^2.2.2
            flutter_local_notifications: ^17.1.2
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          
          flutter:
            uses-material-design: true
          EOF
          echo "✅ pubspec.yaml fixed!"
      
      - name: Recreate Android Folder
        run: |
          echo "Deleting android folder..."
          rm -rf android
          
          echo "Creating fresh Android project..."
          flutter create --platforms=android .
          
          echo "✅ Android folder created!"
      
      - name: Fix app/build.gradle with namespace
        run: |
          echo "🔧 Overwriting app/build.gradle with namespace..."
          cat > android/app/build.gradle << 'EOF'
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
          }
          
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }
          
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }
          
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          
          android {
              namespace "com.yourcompany.yourapp"
              compileSdkVersion 34
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          
              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }
          
              defaultConfig {
                  applicationId 'com.yourcompany.yourapp'
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
          
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          
          flutter {
              source '../..'
          }
          
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0"
          }
          EOF
          echo "✅ app/build.gradle fixed!"
      
      - name: Fix root build.gradle with Kotlin 1.8.0 and resolution
        run: |
          echo "🔧 Fixing root build.gradle with Kotlin 1.8.0..."
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.8.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          
          // ✅ FORCE ALL KOTLIN DEPENDENCIES TO USE 1.8.0
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { DependencyResolveDetails details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '1.8.0'
                          }
                      }
                  }
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF
          echo "✅ root build.gradle with Kotlin 1.8.0 and resolution fixed!"
      
      - name: Fix AndroidManifest.xml package name
        run: |
          echo "🔧 Fixing package name in AndroidManifest.xml..."
          sed -i 's/package=".*"/package="com.yourcompany.yourapp"/' android/app/src/main/AndroidManifest.xml
          echo "✅ Package name fixed!"
      
      - name: Add Storage Permissions
        run: |
          echo "Adding permissions to AndroidManifest.xml..."
          sed -i '/<manifest /a\
          \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\
          \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          echo "✅ Permissions added!"
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Force Kotlin version in pub-cache packages
        run: |
          echo "🔧 Fixing Kotlin version in pub-cache packages..."
          find ~/.pub-cache -name "build.gradle" -type f -exec sed -i "s/ext.kotlin_version = '1.7.10'/ext.kotlin_version = '1.8.0'/g" {} \;
          find ~/.pub-cache -name "build.gradle" -type f -exec sed -i "s/kotlin_version = '1.7.10'/kotlin_version = '1.8.0'/g" {} \;
          find ~/.pub-cache -name "build.gradle" -type f -exec sed -i "s/ext.kotlin_version = '1.7.1'/ext.kotlin_version = '1.8.0'/g" {} \;
          find ~/.pub-cache -name "build.gradle" -type f -exec sed -i "s/kotlin_version = '1.7.1'/kotlin_version = '1.8.0'/g" {} \;
          find ~/.pub-cache -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' {} \;
          echo "✅ All pub-cache packages fixed to Kotlin 1.8.0!"
      
      - name: Build Release APK
        run: flutter build apk --release
      
      - name: Build Debug APK
        run: flutter build apk --debug

      # ✅ YAHAN UPLOAD STEP ADD KARO!
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
