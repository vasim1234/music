name: Build APK (Fresh Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      
      - name: Force Fetch Latest Code
        run: |
          git fetch --all
          git reset --hard origin/main
          echo "✅ Latest code fetched!"
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: ULTIMATE CLEAN
        run: |
          echo "🔥 Cleaning everything..."
          flutter clean
          rm -rf build/
          rm -rf ~/.pub-cache
          rm -f pubspec.lock
          rm -rf .dart_tool/
          echo "✅ Everything clean!"
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build Debug APK
        run: |
          echo "🚀 Building APK..."
          flutter build apk --debug
      
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
