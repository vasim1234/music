name: Build APK (Fresh Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      
      - name: Force Fetch Latest Code
        run: |
          git fetch --all
          git reset --hard origin/main
          echo "✅ Latest code fetched!"
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: ULTIMATE CLEAN
        run: |
          echo "🔥 Cleaning everything..."
          flutter clean
          rm -rf build/
          rm -rf ~/.pub-cache
          rm -f pubspec.lock
          rm -rf .dart_tool/
          echo "✅ Everything clean!"
      
      # ✅ CRITICAL: Enable V2 Embedding
      - name: Enable Android V2 Embedding
        run: |
          echo "🔧 Enabling Android V2 embedding..."
          
          # Fix AndroidManifest.xml
          if grep -q "flutterEmbedding" android/app/src/main/AndroidManifest.xml; then
            echo "✅ V2 embedding already exists"
          else
            sed -i 's/<application/<meta-data android:name="flutterEmbedding" android:value="2" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi
          
          # Create MainActivity.kt
          mkdir -p android/app/src/main/kotlin/com/yourcompany/yourapp
          cat > android/app/src/main/kotlin/com/yourcompany/yourapp/MainActivity.kt << 'EOF'
          package com.yourcompany.yourapp
          
          import io.flutter.embedding.android.FlutterActivity
          
          class MainActivity: FlutterActivity()
          EOF
          
          echo "✅ Android V2 embedding enabled!"
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build Debug APK
        run: |
          echo "🚀 Building APK..."
          flutter build apk --debug
      
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
