name: Build Empty Test App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      # 🔥 YEH SABSE IMPORTANT STEP HAI - SAB KUCH DELETE KARO
      - name: Create EMPTY Flutter App
        run: |
          echo "Deleting EVERYTHING..."
          rm -rf android ios lib pubspec.yaml assets
          
          echo "Creating brand new EMPTY Flutter app..."
          flutter create --platforms=android .
          
          echo "Building EMPTY debug APK..."
          flutter build apk --debug
      
      - name: Upload EMPTY APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: empty-app
          path: build/app/outputs/flutter-apk/app-debug.apk
